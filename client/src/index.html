<!doctype html>
<html lang="sv">
<head>

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- The design's fonts. preconnect opens the connections early, so the fonts arrive sooner.
       display=swap shows the text in a fallback font until the font has loaded. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Space+Mono&display=swap">
</head>
<!-- The body text's style from Figma (Body/M); everything inside inherits it. -->
<body class="text-body-m">
  <app-root></app-root>
</body>
</html>
