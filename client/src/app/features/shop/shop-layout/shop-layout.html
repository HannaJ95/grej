<header class="header">
  <div class="page-width header-content">
    <a class="logo text-display-logo" routerLink="/" aria-label="GREJ, till startsidan">GREJ.</a>
    <!-- Hidden on phones, where the menu has the same links. -->
    <nav class="nav" aria-label="Huvudmeny">
      <a
        class="nav-link text-label-nav"
        routerLink="/produkter"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        Shop
      </a>
      <a
        class="nav-link text-label-nav"
        routerLink="/om-grej"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >
        Om GREJ
      </a>
    </nav>
    <div class="actions">
      <!-- Hidden on phones, where the menu has it. -->
      <button appThemeToggle class="theme-toggle"></button>
      <!-- #cart lets the menu's cart button open the drawer. -->
      <app-cart-drawer #cart />
      <app-mobile-menu class="mobile-menu" (openCart)="cart.open()" />
    </div>
  </div>
  <!-- "Till kassan" opens the cart first, so the customer sees what happens and any error. -->
  <app-added-to-cart (viewCart)="cart.open()" (checkout)="cart.open(); cart.goToCheckout()" />
</header>

<main>
  <router-outlet />
</main>

<!-- The light mode's colors, so it is dark in both modes. -->
<footer class="footer" data-theme="light">
  <div class="page-width">
    <nav class="footer-nav" aria-label="Sidfot">
      <div class="footer-column">
        <h2 class="footer-heading text-heading-xs">Shop</h2>
        <ul class="footer-links text-body-s">
          <li><a routerLink="/produkter">Alla produkter</a></li>
          @for (category of footerCategories(); track category.id) {
            <li>
              <a routerLink="/produkter" [queryParams]="{ kategori: category.id }">
                {{ category.name }}
              </a>
            </li>
          }
        </ul>
      </div>
      <div class="footer-column">
        <h2 class="footer-heading text-heading-xs">GREJ</h2>
        <ul class="footer-links text-body-s">
          <li><a routerLink="/om-grej">Om GREJ</a></li>
          <li><a routerLink="/villkor">Villkor</a></li>
        </ul>
      </div>
    </nav>

    <!-- The big logo is decoration; the header's logo already has the name. -->
    <p class="footer-logo text-display-wordmark" aria-hidden="true">
      <span>G</span><span>R</span><span>E</span><span>J</span><span>.</span>
    </p>

    <div class="footer-bottom text-mono-s">
      <p>© 2026 GREJ</p>
      <p>Betalning via Stripe — Handgjort i Sverige</p>
    </div>
  </div>
</footer>
