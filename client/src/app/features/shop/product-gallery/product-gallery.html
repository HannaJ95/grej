@if (images()[selected()]; as image) {
  <div class="main">
    <img class="image" [src]="image.url" [alt]="image.altText" />
    <button
      appIconButton
      filled
      icon="zoom-in"
      class="zoom"
      type="button"
      aria-label="Förstora bilden"
      aria-haspopup="dialog"
      (click)="viewer.open()"
    ></button>
  </div>
  <app-image-viewer #viewer [images]="images()" [(index)]="selected" />
} @else {
  <span class="main image"></span>
}

@if (images().length > 0) {
  <ul class="thumbnails">
    @for (image of images(); track image.id) {
      <li>
        <!-- The button has the label, so the small image is decoration. -->
        <button
          type="button"
          class="thumbnail"
          [attr.aria-label]="'Visa bild ' + ($index + 1) + ' av ' + images().length"
          [attr.aria-pressed]="$index === selected()"
          (click)="selected.set($index)"
        >
          <img [src]="image.url" alt="" />
        </button>
      </li>
    }
  </ul>
}
