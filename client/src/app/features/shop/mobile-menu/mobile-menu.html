<button class="menu-button" type="button" aria-label="Meny" aria-haspopup="dialog" (click)="open()">
  <span></span>
  <span></span>
  <span></span>
</button>

<dialog #dialog aria-labelledby="menu-title" (click)="closeOnBackdrop($event)">
  <div class="panel">
    <div class="panel-header">
      <h2 class="panel-title text-display-xs" id="menu-title">Meny</h2>
      <button
        appIconButton
        icon="close"
        tone="light"
        type="button"
        aria-label="Stäng"
        (click)="close()"
      ></button>
    </div>

    <nav aria-label="Huvudmeny">
      <ul class="links">
        <li>
          <!-- Closes the menu, since the new page is shown behind it. -->
          <a
            class="link text-display-m"
            routerLink="/produkter"
            routerLinkActive="active"
            ariaCurrentWhenActive="page"
            (click)="close()"
          >
            Shop
            <app-icon name="arrow-right" />
          </a>
        </li>
      </ul>
    </nav>

    <div class="panel-footer">
      <button appThemeToggle showLabel class="theme-toggle text-label-m"></button>
      <button class="cart-button text-label-m" type="button" (click)="goToCart()">
        Varukorg
        <span class="cart-count text-label-s">
          {{ cart.count() }} {{ cart.count() === 1 ? 'grej' : 'grejer' }}
          <app-icon name="arrow-right" />
        </span>
      </button>
      <p class="legal text-mono-s">© 2026 GREJ — Handgjort i Sverige</p>
    </div>
  </div>
</dialog>
