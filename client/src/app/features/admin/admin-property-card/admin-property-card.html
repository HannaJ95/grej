<h2 class="text-display-2xs" id="property-card-title">
  {{ editing() ? 'Redigera ' + texts().singular : texts().newOne }}
</h2>

<form class="fields" aria-labelledby="property-card-title" [formRoot]="propertyForm">
  <p class="field">
    <label class="text-label-xs" for="property-name">Namn</label>
    <input
      #nameInput
      id="property-name"
      class="text-body-m-compact"
      type="text"
      [placeholder]="texts().example"
      [formField]="propertyForm.name"
      [attr.aria-invalid]="nameError() ? true : null"
      [attr.aria-describedby]="nameError() ? 'property-name-error' : null"
    />
    @if (nameError(); as message) {
      <span class="error text-body-xs" id="property-name-error">{{ message }}</span>
    }
  </p>

  <button appButton size="large" type="submit" [disabled]="propertyForm().submitting()">
    {{ editing() ? 'Spara ändringar' : 'Lägg till ' + texts().singular }}
  </button>
  @if (editing()) {
    <button appButton variant="secondary" size="large" type="button" (click)="cancelled.emit()">
      Avbryt
    </button>
  }

  @if (saveError(); as message) {
    <p role="alert">{{ message }}</p>
  }
</form>
