<h2 class="text-display-2xs" id="category-card-title">
  {{ editing() ? 'Redigera' : 'Ny' }} {{ texts().noun }}
</h2>

<!-- formRoot turns off the browser's own validation and runs save() in admin-category-card.ts. -->
<form class="fields" aria-labelledby="category-card-title" [formRoot]="categoryForm">
  @if (kind() === 'sub') {
    <p class="field">
      <label class="text-label-xs" for="category-parent">Huvudkategori</label>
      <!-- The browser's own arrow is hidden (appearance: none) and the chevron icon is shown. -->
      <span class="select">
        <select
          id="category-parent"
          class="text-body-m-compact"
          [formField]="categoryForm.parentId"
          [attr.aria-invalid]="parentError() ? true : null"
          [attr.aria-describedby]="parentError() ? 'category-parent-error' : null"
        >
          <!-- value "" is what required() sees as empty. -->
          <option value="">
            {{ editing() ? 'Ingen – gör den till en huvudkategori' : 'Välj huvudkategori' }}
          </option>
          <!-- The options can arrive after the form. Signal Forms then selects the right one. -->
          @for (c of mainCategories(); track c.id) {
            <option [value]="c.id">{{ c.name }}</option>
          }
        </select>
        <app-icon name="chevron-down" />
      </span>
      @if (parentError(); as message) {
        <span class="error text-body-xs" id="category-parent-error">{{ message }}</span>
      }
    </p>
  }

  <p class="field">
    <label class="text-label-xs" for="category-name">Namn</label>
    <!-- #nameInput lets focusName() find the field. -->
    <input
      #nameInput
      id="category-name"
      class="text-body-m-compact"
      type="text"
      [placeholder]="texts().example"
      [formField]="categoryForm.name"
      [attr.aria-invalid]="nameError() ? true : null"
      [attr.aria-describedby]="nameError() ? 'category-name-error' : null"
    />
    @if (nameError(); as message) {
      <span class="error text-body-xs" id="category-name-error">{{ message }}</span>
    }
  </p>

  <button appButton size="large" type="submit" [disabled]="categoryForm().submitting()">
    {{ editing() ? 'Spara ändringar' : 'Lägg till ' + texts().noun }}
  </button>
  @if (editing()) {
    <button appButton variant="secondary" size="large" type="button" (click)="cancelled.emit()">
      Avbryt
    </button>
  }

  @if (saveError(); as message) {
    <p role="alert">{{ message }}</p>
  }
</form>
